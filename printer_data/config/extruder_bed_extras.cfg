##############################
# Extruder Sherpa Mini
##############################

[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 22.67895
gear_ratio: 50:10
step_pulse_duration: 0.000002
nozzle_diameter: 0.4
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: Generic 3950
sensor_pin: P0.24
max_power: 1.0
pressure_advance: 0.022
pressure_advance_smooth_time: 0.02
min_extrude_temp: 180
min_temp: 0
max_temp: 300
max_extrude_only_distance: 101
max_extrude_cross_section: 3.5

[firmware_retraction]
retract_length: 0.8
retract_speed: 60
unretract_speed: 45

##############################
# Bed Heater
##############################

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
min_temp: 0
max_temp: 80

##############################
# Fans
##############################

[fan]
pin: P2.3
kick_start_time: 0.500
max_power: 1

[heater_fan hotend_fan]
pin: P2.4
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

##############################
# Bed Screws
##############################

[screws_tilt_adjust]
screw1_name: front left screw
screw1: 1,25
screw2_name: front right screw
screw2: 161,25
screw3_name: rear left screw
screw3: 1,195
screw4_name: rear right screw
screw4: 161,195
horizontal_move_z: 5
speed: 200
screw_thread: CW-M4

##############################
# Filament Sensor
##############################

#[filament_switch_sensor filament_sensor]
#switch_pin: ^P1.24
#pause_on_runout: True
#insert_gcode:
    #M117 Insert Detected
#runout_gcode:
   # M117 Runout Detected

##############################
# Z-Tilt
##############################

[z_tilt]
z_positions:
    0,235
    235,235
points:
    1,100
    180,100
speed: 200
horizontal_move_z: 10
retries: 6
retry_tolerance: 0.05

##############################
# Temperature Sensors
##############################

[temperature_sensor rpi zero 2w]
sensor_type: temperature_host
min_temp: 10
max_temp: 100