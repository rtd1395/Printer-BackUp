#####################################################################
# Main
#####################################################################

[include mainsail.cfg]
[include drive_stepper.cfg]
[include extruder_bed_extras.cfg]
[include macro.cfg]
[include eddy.cfg]
[include menu.cfg]
[include screws_display.cfg]
[include autotune.cfg]
#[include lis2dw.cfg]

[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4800
max_z_velocity: 10
max_z_accel: 100
minimum_cruise_ratio: 0.3
square_corner_velocity: 5

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp0"

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[force_move]
enable_force_move: True 

[exclude_object]

[pause_resume]

[input_shaper]

[idle_timeout]
gcode:
    timeout:600

