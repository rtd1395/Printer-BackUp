#####################################################################
# Main
#####################################################################

[include mainsail.cfg]
[include drive_stepper.cfg]
[include extruder_bed_extras.cfg]
[include macro.cfg]
[include eddy.cfg]
[include autotune.cfg]
#[include lis2dw.cfg]

[mcu]
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4800
max_z_velocity: 10
max_z_accel: 100
minimum_cruise_ratio: 0.3
square_corner_velocity: 5

[force_move]
enable_force_move: True 

[exclude_object]

[input_shaper]

[idle_timeout]
timeout: 240

