##############################
# Eddy
##############################

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504450613071541C-if00 
restart_method: command

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
descend_z: 2
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 36
y_offset: 14

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10 
max_temp: 100

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2
calibration_position: 80,112,50
calibration_extruder_temp: 220
extruder_heating_z: 30
max_validation_temp: 60
resting_z: 2